[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "couponevo"
version = "0.1.0"
description = "Agent-guided uplift experiments for cost-aware coupon targeting"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.0", "torch>=2.2", "econml>=0.17,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]
